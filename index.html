<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Inventory Counter Pro</title>

<style>
:root{
--bg:#0b0f17;--card:#151b27;--field:#222a3a;--line:#30394d;
--primary:#39f2b2;--danger:#ff6464;--blue:#4dadff;--yellow:#ffd166;
--text:#fff;--muted:#9ca6b8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px}
.app{max-width:760px;margin:auto}
h1{color:var(--primary);font-size:32px;margin:8px 0 18px}
h2,h3{color:var(--primary);margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px}
input,button,textarea,select{
width:100%;padding:15px;margin:8px 0;border-radius:16px;border:1px solid var(--line);
background:var(--field);color:var(--text);font-size:18px
}
button{background:var(--primary);color:#000;font-weight:900;border:0}
button.secondary{background:#384154;color:#fff}
button.danger{background:var(--danger);color:#fff}
button.ghost{background:#252d3d;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none!important}
.badge{display:inline-block;background:#30394d;color:var(--muted);padding:6px 11px;border-radius:99px;font-size:14px;margin:3px}
.status{background:#202b3e;color:var(--blue);padding:14px;border-radius:16px;margin-top:10px}
.preview,.video{width:100%;max-height:370px;object-fit:contain;background:#000;border:1px solid var(--line);border-radius:18px}
.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:12px 0}
.row:last-child{border-bottom:0}
.stepbar{height:8px;background:#263043;border-radius:99px;overflow:hidden;margin:10px 0 18px}
.stepfill{height:100%;background:var(--primary);width:0%}
.bigqty{text-align:center;font-size:46px;font-weight:900;letter-spacing:1px;color:var(--yellow)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{font-size:24px;padding:18px}
.productbox{background:#202838;border:1px solid var(--line);border-radius:18px;padding:14px}
.good{color:var(--primary)}
.bad{color:var(--danger)}
.muted{color:var(--muted)}
@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style>
</head>

<body>
<div class="app">
<h1>Inventory Counter Pro</h1>

<section id="setupPage" class="card">
<h2>Start Count</h2>
<input id="userName" placeholder="Your name">
<input id="businessUnit" placeholder="Business Unit">
<input id="storageLocation" placeholder="Storage Location">
<input id="webAppUrl" placeholder="Apps Script Web App URL">
<button onclick="saveSetup()">Start Counting</button>
</section>

<section id="mainApp" class="hidden">

<div class="card">
<span class="badge" id="userBadge"></span>
<span class="badge" id="branchBadge"></span>
<span class="badge" id="pendingBadge"></span>
<div id="statusBox" class="status hidden"></div>
</div>

<div class="stepbar"><div class="stepfill" id="stepFill"></div></div>

<section id="pagePhoto" class="card page">
<h2>1. Take Photo</h2>
<input type="file" id="photoInput" accept="image/*" capture="environment" onchange="loadPhoto(event)">
<img id="photoPreview" class="preview hidden">
<div class="grid">
<button class="secondary" onclick="clearPhoto()">Retake</button>
<button onclick="nextPage()">Next</button>
</div>
</section>

<section id="pageBarcode" class="card page hidden">
<h2>2. Scan Barcode</h2>
<input id="barcode" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Scan or enter barcode">
<button onclick="startBarcodeScanner()">Scan Barcode</button>

<div id="scannerBox" class="hidden">
<video id="barcodeVideo" class="video" autoplay playsinline></video>
<button class="danger" onclick="stopBarcodeScanner()">Stop Scanner</button>
</div>

<div class="grid">
<button class="secondary" onclick="prevPage()">Back</button>
<button onclick="lookupByBarcode()">Next</button>
</div>
</section>

<section id="pageProduct" class="card page hidden">
<h2>3. Product Details</h2>
<div id="productResult" class="productbox"></div>

<div id="manualBox" class="hidden">
<input id="manualCode" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Enter item code - 6 or 13 digits">
<button class="secondary" onclick="lookupByCode()">Find Item Code</button>
<input id="manualName" placeholder="Item description">
<input id="manualUom" placeholder="UOM e.g. PCS, KG, GM">
<select id="manualBatched">
<option value="No">Not Batched</option>
<option value="Yes">Batched Product</option>
</select>
</div>

<div class="grid">
<button class="secondary" onclick="prevPage()">Back</button>
<button onclick="confirmProduct()">Next</button>
</div>
</section>

<section id="pageBatch" class="card page hidden">
<h2>4. Batch Number</h2>
<input id="batchNumber" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="Enter 6 digit batch number">
<div class="grid">
<button class="secondary" onclick="showPage(2)">Back</button>
<button onclick="confirmBatch()">Next</button>
</div>
</section>

<section id="pageQty" class="card page hidden">
<h2>5. Quantity</h2>
<div class="bigqty" id="qtyDisplay">0.000</div>

<div class="keypad">
<button onclick="qtyKey('1')">1</button>
<button onclick="qtyKey('2')">2</button>
<button onclick="qtyKey('3')">3</button>
<button onclick="qtyKey('4')">4</button>
<button onclick="qtyKey('5')">5</button>
<button onclick="qtyKey('6')">6</button>
<button onclick="qtyKey('7')">7</button>
<button onclick="qtyKey('8')">8</button>
<button onclick="qtyKey('9')">9</button>
<button class="ghost" onclick="qtyBack()">⌫</button>
<button onclick="qtyKey('0')">0</button>
<button class="danger" onclick="qtyClear()">Clear</button>
</div>

<textarea id="notes" placeholder="Notes, optional"></textarea>

<div class="grid">
<button class="secondary" onclick="goBackFromQty()">Back</button>
<button onclick="confirmQty()">Next</button>
</div>
</section>

<section id="pageReview" class="card page hidden">
<h2>6. Confirm Item</h2>
<div id="reviewBox"></div>
<div class="grid">
<button class="secondary" onclick="showPage(4)">Back</button>
<button id="submitBtn" onclick="submitEntry()">Confirm & Next</button>
</div>
<button class="danger" onclick="clearEntry()">Clear Entry</button>
</section>

<div class="card">
<h3>Local Safety</h3>
<button class="secondary" onclick="retryPending()">Retry Pending Uploads</button>
<button class="secondary" onclick="changeSetup()">Change User / Branch</button>
<button class="danger" onclick="resetSetup()">Reset App</button>
</div>

</section>
</div>

<script>
const DEFAULT_WEB_APP_URL="https://script.google.com/macros/s/AKfycbwoDd_8WBZWctiw8SNGWtZRBxUraNjGCtlp-NR0Rlh7LcQcnadT8X0mRTQgyzYBZPJQZA/exec";
const STORAGE_KEY="inventory_counter_branch_settings_v1";
const PENDING_KEY="inventory_counter_branch_pending_v1";

let settings=JSON.parse(localStorage.getItem(STORAGE_KEY))||{
userName:"",
businessUnit:"",
storageLocation:"",
webAppUrl:DEFAULT_WEB_APP_URL
};

let pending=JSON.parse(localStorage.getItem(PENDING_KEY))||[];
let pages=[],currentPage=0;
let photoBase64="",scannerStream=null,scannerTimer=null;
let selectedProduct=null;
let productFound=false;
let qtyDigits="";

window.onload=()=>{
pages=[...document.querySelectorAll(".page")];

userName.value=settings.userName||"";
businessUnit.value=settings.businessUnit||"";
storageLocation.value=settings.storageLocation||"";
webAppUrl.value=settings.webAppUrl||DEFAULT_WEB_APP_URL;

if(settings.userName&&settings.businessUnit&&settings.storageLocation&&settings.webAppUrl){
openApp();
}

updatePendingBadge();
updateStep();
renderQty();
};

function msg(t){
statusBox.textContent=t;
statusBox.classList.remove("hidden");
}

function clearMsg(){
statusBox.classList.add("hidden");
}

function saveSetup(){
const name=userName.value.trim();
const bu=businessUnit.value.trim();
const loc=storageLocation.value.trim();
const url=webAppUrl.value.trim();

if(!name)return alert("Enter your name");
if(!bu)return alert("Enter Business Unit");
if(!loc)return alert("Enter Storage Location");
if(!url.startsWith("https://script.google.com/"))return alert("Enter valid Apps Script URL");

settings={userName:name,businessUnit:bu,storageLocation:loc,webAppUrl:url};
localStorage.setItem(STORAGE_KEY,JSON.stringify(settings));
openApp();
}

function openApp(){
setupPage.classList.add("hidden");
mainApp.classList.remove("hidden");
userBadge.textContent="User: "+settings.userName;
branchBadge.textContent=settings.businessUnit+" / "+settings.storageLocation;
updatePendingBadge();
}

function changeSetup(){
mainApp.classList.add("hidden");
setupPage.classList.remove("hidden");
}

function resetSetup(){
if(!confirm("Reset app settings and pending uploads?"))return;
localStorage.removeItem(STORAGE_KEY);
localStorage.removeItem(PENDING_KEY);
location.reload();
}

function showPage(i){
pages.forEach(p=>p.classList.add("hidden"));
pages[i].classList.remove("hidden");
currentPage=i;
if(i===5)renderReview();
updateStep();
window.scrollTo({top:0,behavior:"smooth"});
}

function nextPage(){if(currentPage<pages.length-1)showPage(currentPage+1)}
function prevPage(){if(currentPage>0)showPage(currentPage-1)}

function updateStep(){
stepFill.style.width=((currentPage+1)/pages.length*100)+"%";
}

function loadPhoto(e){
const file=e.target.files[0];
if(!file)return;

const reader=new FileReader();
reader.onload=x=>compressImage(x.target.result,760,0.58,result=>{
photoBase64=result;
photoPreview.src=result;
photoPreview.classList.remove("hidden");
});
reader.readAsDataURL(file);
}

function compressImage(base64,maxWidth,quality,cb){
const img=new Image();
img.onload=()=>{
const canvas=document.createElement("canvas");
const scale=Math.min(maxWidth/img.width,1);
canvas.width=Math.round(img.width*scale);
canvas.height=Math.round(img.height*scale);
canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
cb(canvas.toDataURL("image/jpeg",quality));
};
img.src=base64;
}

function clearPhoto(){
photoBase64="";
photoInput.value="";
photoPreview.src="";
photoPreview.classList.add("hidden");
}

async function startBarcodeScanner(){
clearMsg();

if(!location.protocol.startsWith("https")){
return alert("Scanner needs HTTPS.");
}

if(!("BarcodeDetector" in window)){
return alert("Barcode scanner not supported on this browser. Enter barcode manually.");
}

try{
scannerBox.classList.remove("hidden");

scannerStream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:{ideal:"environment"}}
});

barcodeVideo.srcObject=scannerStream;

const detector=new BarcodeDetector({
formats:["ean_13","ean_8","code_128","code_39","upc_a","upc_e","qr_code"]
});

scannerTimer=setInterval(async()=>{
try{
const codes=await detector.detect(barcodeVideo);
if(codes.length){
barcode.value=codes[0].rawValue.replace(/\D/g,"");
stopBarcodeScanner();
msg("Barcode scanned: "+barcode.value);
if(navigator.vibrate)navigator.vibrate(100);
lookupByBarcode();
}
}catch(e){}
},600);

}catch(e){
stopBarcodeScanner();
alert("Camera permission denied or scanner failed.");
}
}

function stopBarcodeScanner(){
scannerBox.classList.add("hidden");

if(scannerTimer){
clearInterval(scannerTimer);
scannerTimer=null;
}

if(scannerStream){
scannerStream.getTracks().forEach(t=>t.stop());
scannerStream=null;
}
}

async function lookupByBarcode(){
const bc=barcode.value.trim().replace(/\D/g,"");
selectedProduct=null;
productFound=false;
manualBox.classList.add("hidden");

if(!bc){
productResult.innerHTML=`<h3 class="bad">No barcode entered</h3><p class="muted">Enter item code manually.</p>`;
manualBox.classList.remove("hidden");
showPage(2);
return;
}

msg("Looking up barcode...");

try{
const url=settings.webAppUrl+"?action=lookupBarcode&barcode="+encodeURIComponent(bc);
const res=await fetch(url);
const json=await res.json();

if(json.success&&json.found){
selectedProduct=json.product;
productFound=true;
showProductFound(selectedProduct);
clearMsg();
}else{
productResult.innerHTML=`<h3 class="bad">Product not found</h3><p class="muted">Enter item details manually.</p>`;
manualBox.classList.remove("hidden");
manualCode.value="";
manualName.value="";
manualUom.value="PCS";
manualBatched.value="No";
clearMsg();
}

showPage(2);

}catch(e){
msg("Lookup failed. Enter manually.");
manualBox.classList.remove("hidden");
showPage(2);
}
}

async function lookupByCode(){
const code=manualCode.value.trim();

if(!/^(\d{6}|\d{13})$/.test(code)){
return alert("Item code must be 6 or 13 digits.");
}

msg("Looking up item code...");

try{
const url=settings.webAppUrl+"?action=lookupCode&code="+encodeURIComponent(code);
const res=await fetch(url);
const json=await res.json();

if(json.success&&json.found){
selectedProduct=json.product;
productFound=true;
showProductFound(selectedProduct);
manualBox.classList.add("hidden");
clearMsg();
}else{
msg("Item not found. Enter description manually.");
}

}catch(e){
msg("Lookup failed. Enter manually.");
}
}

function showProductFound(p){
productResult.innerHTML=`
<h3 class="good">Product Found</h3>
<div class="row"><span>Code</span><b>${esc(p.code)}</b></div>
<div class="row"><span>Description</span><b>${esc(p.name)}</b></div>
<div class="row"><span>Category</span><b>${esc(p.category||"-")}</b></div>
<div class="row"><span>UOM</span><b>${esc(p.uom)}</b></div>
<div class="row"><span>Batched</span><b>${isBatched(p)?"Yes":"No"}</b></div>
`;
}

function confirmProduct(){
if(productFound&&selectedProduct){
if(isBatched(selectedProduct))showPage(3);
else showPage(4);
return;
}

const code=manualCode.value.trim();

if(!/^(\d{6}|\d{13})$/.test(code)){
return alert("Item code must be 6 or 13 digits.");
}

if(!manualName.value.trim())return alert("Enter item description");
if(!manualUom.value.trim())return alert("Enter UOM");

selectedProduct={
code,
name:manualName.value.trim(),
category:"",
uom:manualUom.value.trim(),
upc:barcode.value.trim(),
batched:manualBatched.value
};

if(isBatched(selectedProduct))showPage(3);
else showPage(4);
}

function isBatched(p){
return /^(y|yes|true|1)$/i.test(String(p.batched||"").trim());
}

function confirmBatch(){
const b=batchNumber.value.trim();

if(!/^\d{6}$/.test(b)){
return alert("Batch number must be exactly 6 digits.");
}

showPage(4);
}

function goBackFromQty(){
if(selectedProduct&&isBatched(selectedProduct))showPage(3);
else showPage(2);
}

function qtyKey(d){
qtyDigits=(qtyDigits+d).replace(/^0+/,"");
if(qtyDigits.length>12)qtyDigits=qtyDigits.slice(0,12);
renderQty();
}

function qtyBack(){
qtyDigits=qtyDigits.slice(0,-1);
renderQty();
}

function qtyClear(){
qtyDigits="";
renderQty();
}

function renderQty(){
const n=Number(qtyDigits||0)/1000;
qtyDisplay.textContent=n.toFixed(3);
}

function getQty(){
return Number((Number(qtyDigits||0)/1000).toFixed(3));
}

function confirmQty(){
if(getQty()<=0)return alert("Enter quantity");
showPage(5);
}

function getEntry(){
return{
userName:settings.userName,
businessUnit:settings.businessUnit,
storageLocation:settings.storageLocation,
photoBase64,
barcode:barcode.value.trim(),
itemCode:selectedProduct?.code||"",
itemDescription:selectedProduct?.name||"",
uom:selectedProduct?.uom||"",
batchNumber:selectedProduct&&isBatched(selectedProduct)?batchNumber.value.trim():"",
quantity:getQty(),
notes:notes.value.trim(),
localTime:new Date().toLocaleString()
};
}

function renderReview(){
const e=getEntry();

reviewBox.innerHTML=`
${photoBase64?`<img src="${photoBase64}" class="preview">`:`<p class="bad">No photo selected</p>`}
<div class="row"><span>Business Unit</span><b>${esc(e.businessUnit)}</b></div>
<div class="row"><span>Storage Location</span><b>${esc(e.storageLocation)}</b></div>
<div class="row"><span>Barcode</span><b>${esc(e.barcode||"-")}</b></div>
<div class="row"><span>Item Code</span><b>${esc(e.itemCode)}</b></div>
<div class="row"><span>Description</span><b>${esc(e.itemDescription)}</b></div>
<div class="row"><span>UOM</span><b>${esc(e.uom)}</b></div>
<div class="row"><span>Batch</span><b>${esc(e.batchNumber||"-")}</b></div>
<div class="row"><span>Quantity</span><b>${e.quantity.toFixed(3)}</b></div>
<div class="row"><span>Notes</span><b>${esc(e.notes||"-")}</b></div>
`;
}

async function submitEntry(){
const entry=getEntry();

if(!entry.photoBase64)return alert("Please take item photo");
if(!entry.barcode&&!entry.itemCode)return alert("Barcode or item code required");
if(!entry.quantity||entry.quantity<=0)return alert("Quantity required");

submitBtn.disabled=true;
submitBtn.textContent="Uploading...";
msg("Uploading...");

try{
await uploadEntry(entry);
msg("Saved. Ready for next item.");
clearEntry();
showPage(0);
}catch(e){
pending.push(entry);
savePending();
msg("Upload failed. Saved locally. Retry later.");
}

submitBtn.disabled=false;
submitBtn.textContent="Confirm & Next";
}

async function uploadEntry(entry){
const res=await fetch(settings.webAppUrl,{
method:"POST",
headers:{"Content-Type":"text/plain;charset=utf-8"},
body:JSON.stringify(entry)
});

const text=await res.text();
let json;

try{
json=JSON.parse(text);
}catch(e){
throw new Error(text);
}

if(!json.success)throw new Error(json.message||"Upload failed");

return json;
}

async function retryPending(){
if(!pending.length){
msg("No pending uploads");
return;
}

let ok=0;
let failed=[];

for(const entry of pending){
try{
await uploadEntry(entry);
ok++;
}catch(e){
failed.push(entry);
}
}

pending=failed;
savePending();
msg(ok+" uploaded, "+pending.length+" pending");
}

function savePending(){
localStorage.setItem(PENDING_KEY,JSON.stringify(pending));
updatePendingBadge();
}

function updatePendingBadge(){
pendingBadge.textContent="Pending: "+pending.length;
}

function clearEntry(){
clearPhoto();
barcode.value="";
manualCode.value="";
manualName.value="";
manualUom.value="PCS";
manualBatched.value="No";
batchNumber.value="";
notes.value="";
selectedProduct=null;
productFound=false;
qtyDigits="";
renderQty();
clearMsg();
}

function esc(s){
return String(s??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));
}
</script>
</body>
</html>
